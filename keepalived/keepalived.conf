vrrp_script chk_seaweedfs {
    script "/usr/bin/curl -sf http://127.0.0.1:9333/cluster/status || exit 1"
    interval 2
    weight -20
    fall 3
    rise 2
}

vrrp_instance VI_SEAWEEDFS {
    state MASTER
    interface INTERFACE_NAME
    virtual_router_id 51
    priority 150
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass SeaweedHA!
    }

    unicast_src_ip HOST
    unicast_peer {
        PEER_1
        PEER_2
    }

    virtual_ipaddress {
        VIRTUAL_IP/24
    }

    track_script {
        chk_seaweedfs
    }
}